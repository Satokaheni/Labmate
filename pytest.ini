[pytest]
asyncio_mode = auto
markers =
    mocked: runs without real subprocesses or GPU
    live: requires a real subprocess / inference server
    bdd: pytest-bdd scenario (Gherkin .feature backed); inherits @mocked or @live
filterwarnings =
    ignore:coroutine 'Logging.async_success_handler' was never awaited:RuntimeWarning:litellm.litellm_core_utils.logging_worker
    ignore:coroutine 'OutboxWorker.run' was never awaited:RuntimeWarning
