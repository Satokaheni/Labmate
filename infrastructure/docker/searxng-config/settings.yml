# SearXNG settings for the Labmate lm-searxng container.
# Enables JSON output so the web-search MCP skill can query GET /search?format=json.
# Bind-mounted at /etc/searxng/settings.yml by docker-compose (./searxng-config).
# Mirrors the native local config written by infrastructure/local/install.sh.

use_default_settings: true

search:
  safe_search: 0
  autocomplete: "duckduckgo"
  formats:
    - html
    - json

server:
  # Reachable only within the Docker network.
  bind_address: "0.0.0.0"
  secret_key: "labmate-searxng-secret-change-in-production"
  # Internal instance — disable the public-abuse limiter so no valkey/redis is needed.
  limiter: false
  image_proxy: false

# Disable telemetry
general:
  debug: false

# Enable common engines
engines:
  - name: duckduckgo
    engine: duckduckgo
    categories: general
    timeout: 3.0
    disabled: false

  - name: github
    engine: github
    categories: [code]
    timeout: 5.0
    disabled: false
