# Labmate Docker Compose — Support Services
# The inference server (vLLM/Gemma 4) runs on the HOST, not in Docker.
# Start it manually before running this Compose stack.
#
# Default inference URL: http://host.docker.internal:8000
# Override: INFERENCE_URL=http://<host-ip>:8000 docker compose up -d
#
# Run: ./scripts/compose-up.sh
# Scale workers: ./scripts/compose-up.sh 4

services:

  # ─── MCP Bridge (TypeScript) ──────────────────────────────────────────────
  # Connects to the host-side inference server via INFERENCE_URL.
  # On Linux, host.docker.internal resolves via the extra_hosts entry below.
  mcp-bridge:
    build: ../../services/mcp-bridge
    image: labmate/mcp-bridge:latest
    environment:
      - INFERENCE_URL=${INFERENCE_URL:-http://host.docker.internal:8000}
      - MCP_PORT=${MCP_PORT:-9000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    extra_hosts:
      # Linux: routes host.docker.internal to the Docker host gateway.
      # Mac: noop — Docker Desktop resolves host.docker.internal natively.
      - "host.docker.internal:host-gateway"
    ports:
      - "${MCP_BRIDGE_PORT:-9000}:9000"
    depends_on:
      mongodb:
        condition: service_healthy
      chroma:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [labmate]
    restart: unless-stopped

  # ─── Python Orchestrator ──────────────────────────────────────────────────
  python-orchestrator:
    build: ../../services/orchestrator
    image: labmate/orchestrator:latest
    environment:
      - INFERENCE_URL=${INFERENCE_URL:-http://host.docker.internal:8000}
      - MCP_BRIDGE_URL=http://mcp-bridge:9000
      - MONGO_URI=mongodb://mongodb:27017/labmate
      - CHROMA_URL=http://chroma:8000
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-info}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mcp-bridge:
        condition: service_started
      mongodb:
        condition: service_healthy
      chroma:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [labmate]
    restart: unless-stopped

  # ─── Skill Worker (CPU-only, horizontally scalable) ───────────────────────
  # Scale: docker compose up -d --scale skill-worker=4
  # Or use compose-up.sh N  (e.g. ./scripts/compose-up.sh 4)
  skill-worker:
    build: ../../services/skill-worker
    image: labmate/skill-worker:latest
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MCP_BRIDGE_URL=http://mcp-bridge:9000
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-2}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      redis:
        condition: service_healthy
      mcp-bridge:
        condition: service_started
    networks: [labmate]
    restart: unless-stopped

  # ─── MongoDB ──────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [labmate]
    restart: unless-stopped

  # ─── ChromaDB (client-server mode) ────────────────────────────────────────
  chroma:
    image: chromadb/chroma:latest
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [labmate]
    restart: unless-stopped

  # ─── Redis (AOF persistence) ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [labmate]
    restart: unless-stopped

# ─── Named Volumes ────────────────────────────────────────────────────────────
# Named volumes survive `docker compose down`. To delete: docker compose down --volumes
volumes:
  mongo-data:
    # MongoDB document store — durable agent state
  chroma-data:
    # ChromaDB vector embeddings — expensive to rebuild
  redis-data:
    # Redis AOF log — preserves task queue across restarts

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  labmate:
    driver: bridge
    # All containers share this network. Docker DNS resolves service names to IPs.
    # The inference server runs on the host and is reached via host.docker.internal.
