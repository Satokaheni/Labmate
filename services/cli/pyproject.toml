[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labmate"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.7.0",
    "prompt_toolkit>=3.0.43",
    "typer>=0.12.0",
    "redis>=5.0,<6",
]

[project.scripts]
labmate = "services.cli.main:app"

[tool.setuptools.packages.find]
where = ["../.."]
include = ["services.cli*"]
