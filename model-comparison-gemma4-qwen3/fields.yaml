fields:
  - name: gemma4_verdict
    description: >
      How google/gemma-4-31B-it performs on this dimension. Be specific:
      cite benchmark scores, community reports, or concrete capability gaps.
      Include quant used if relevant (e.g. UD-Q4_K_XL, Q5_K_M).
    detail_level: detailed

  - name: qwen3_verdict
    description: >
      How Qwen/Qwen3-32B performs on this dimension. Be specific:
      cite benchmark scores, community reports, or concrete capability gaps.
      Include quant used if relevant.
    detail_level: detailed

  - name: winner
    description: >
      Which model wins this dimension for Labmate's use case.
      Values: GEMMA4 / QWEN3 / TIE / UNCERTAIN.
      If UNCERTAIN, explain what data is missing.
    detail_level: brief

  - name: benchmarks
    description: >
      Relevant benchmark scores for this dimension: GPQA Diamond, MMLU-Pro,
      MATH, HumanEval, RULER (long-context), LiveCodeBench, Humanity's Last Exam,
      or any domain-specific academic task benchmarks. Include scores for both models.
    detail_level: moderate

  - name: factual_accuracy
    description: >
      Hallucination rate or factual accuracy score relevant to this dimension.
      GPQA Diamond, SimpleQA, TruthfulQA, or domain-specific factuality evals.
      Scientific research demands low confabulation — this is a first-class concern.
    detail_level: moderate

  - name: inference_speed
    description: >
      Tokens per second on non-CUDA hardware (ROCm AMD, Metal Apple Silicon, or Vulkan)
      at Q4_K_M or Q5_K_M quantization with llama.cpp or MLX. Include hardware spec.
      Relevant for interactive agentic loops. Note if MTP speculative decoding applies.
    detail_level: moderate

  - name: multimodal_support
    description: >
      Does the model support image/figure input? Critical for reading academic papers
      with embedded charts, graphs, and diagrams. State: text-only / image / video.
      For Gemma 4 include variable-aspect-ratio and document-parsing capability.
      For Qwen3 note that the base 32B is text-only (VL is a separate model line).
    detail_level: moderate

  - name: context_window
    description: >
      Nominal context window AND effective usable context window (where retrieval
      accuracy stays above threshold — RULER score or needle-in-haystack results).
      A full academic paper is 8k–20k tokens; a full literature review session
      may need 32k+. Report both advertised and measured effective limits.
    detail_level: moderate

  - name: non_cuda_support
    description: >
      Specific support for non-CUDA inference backends: ROCm/AMD HIP (llama.cpp
      -DGGML_HIPBLAS=ON, vLLM ROCm), Metal/Apple MLX, Vulkan. Include which 32 GB
      non-CUDA GPU models are affordable and confirmed working (e.g. AMD Radeon Pro
      W7800, RX 7900 XTX, RX 9070 XT if 32GB variant exists, Apple M-series).
      Are GGUF quants available? Build complexity?
    detail_level: detailed

  - name: over_refusal_risk
    description: >
      How often does the model refuse legitimate academic or research queries?
      High refusal rates are a practical obstacle for research assistants discussing
      biosafety, security research, dual-use topics, controversial hypotheses.
      Include XSTest scores or community reports of refusal behavior.
    detail_level: moderate

  - name: ecosystem_toolchain
    description: >
      Day-one support across: llama.cpp (GGUF available), Ollama, MLX, vLLM,
      Unsloth, LM Studio. vLLM tool-call parser flag (gemma4 vs hermes).
      HuggingFace model card quality, quantized model availability, MCP/OpenAI
      tool-call format fidelity. Maturity of the model's agentic/tool-call surface.
    detail_level: moderate

  - name: labmate_relevance
    description: >
      HIGH / MEDIUM / LOW — how much this dimension matters for Labmate specifically.
      Labmate is for: academic paper writing, paper critique/review, literature
      synthesis, research ideation, coding ML experiments. Explain the reasoning.
    detail_level: brief

  - name: recommendation
    description: >
      Concrete guidance: for this specific dimension, which model should Labmate use
      as its orchestrator brain? If neither is clearly better, say what would tip
      the decision. Include any model-switching strategy (e.g. use Gemma 4 for
      figure-heavy paper reading, Qwen3 for pure-text reasoning tasks).
    detail_level: detailed

  - name: sources
    description: URLs and references used for this research item.
    detail_level: brief

  - name: uncertain
    description: Reserved — auto-filled with uncertain field names.
    detail_level: brief
