topic: >
  Gemma 4 31B (google/gemma-4-31B-it) vs Qwen3-32B (Qwen/Qwen3-32B) head-to-head
  comparison for Labmate — a local autonomous agent for academic research assistance:
  paper writing, literature synthesis, paper critique/review, research ideation,
  and coding ML experiments. Target hardware: 32 GB VRAM non-CUDA GPU (AMD ROCm or
  Apple Silicon), running host-native via llama.cpp or MLX. Scale: 1–10 users.
  Both models have Apache 2.0 licensing and thinking/reasoning modes.
  Gemma 4 released April 2026; Qwen3-32B released April 2025.

execution:
  output_dir: model-comparison-gemma4-qwen3/results
  items_per_agent: 1
  batch_size: 3

items:
  - name: academic writing and paper critique quality
    category: Core Task Quality
    description: >
      Labmate's primary use: writing academic prose, structuring arguments,
      generating paper sections (abstract, introduction, related work, methods,
      discussion), producing LaTeX output, and giving structured peer-review-style
      critique of draft papers. Research: (1) Which model produces higher-quality
      academic prose — coherent argumentation, appropriate hedging language,
      correct citation formatting? (2) Any published head-to-head on academic
      writing tasks (WritingBench, EssayBench, or community tests)? (3) How do
      both models handle multi-section paper critique — identifying logical gaps,
      methodological weaknesses, missing related work? (4) LaTeX generation
      accuracy for equations, tables, figures? Community reports from researchers
      using each model for academic writing.

  - name: research reasoning and ideation
    category: Core Task Quality
    description: >
      Labmate needs to help generate novel research hypotheses, brainstorm
      experimental designs, synthesize findings across multiple papers, and
      identify research gaps. This requires deep scientific reasoning, not just
      text generation. Research: (1) GPQA Diamond scores for both models —
      this tests expert-level scientific reasoning. (2) Humanity's Last Exam
      performance — tests frontier scientific knowledge. (3) Which model is better
      at "given these 3 papers, what experiment should we run next?" style prompts?
      (4) Do both models hallucinate less in scientific domains when thinking mode
      is enabled? (5) Any academic domain reasoning benchmarks (SciQ, ARC-Challenge,
      MMLU-Pro science tracks)?

  - name: multimodal vision for paper reading
    category: Core Task Quality
    description: >
      Gemma 4 31B is a natively multimodal model (image, video, audio input).
      Qwen3-32B is text-only (vision is a separate Qwen3.5-VL / Qwen3.6-VL model
      line, not the base 32B). Research: (1) For Labmate's paper-reading tasks,
      how important is the ability to directly input paper PDFs with figures, charts,
      tables, and diagrams? (2) What is Gemma 4 31B's actual vision capability for
      academic documents — can it parse dense figure captions, read axes labels,
      interpret result tables? (3) If Qwen3-32B is text-only, what is the practical
      workaround (OCR preprocessing, separate vision model)? (4) Are there
      Qwen3.5-VL or Qwen3.6-VL variants at similar parameter count that could
      substitute? (5) Does vision capability fit on 32 GB non-CUDA VRAM alongside
      text inference?

  - name: long context performance and degradation
    category: Core Task Quality
    description: >
      A full academic paper is 8k–20k tokens; a literature review session may
      require 32k–64k. Maintaining coherence across a full paper is critical.
      Research: (1) Nominal context windows for both models. (2) Effective usable
      context: RULER scores, needle-in-haystack results, or "lost-in-the-middle"
      degradation data at 16k, 32k, 64k tokens. Qwen3-32B RULER drops from 91.8
      at 64K to 85.6 at 128K in non-thinking mode — what is Gemma 4's equivalent?
      (3) At 32 GB VRAM with Q4/Q5 quant, what is the maximum KV cache budget and
      thus maximum practical context length? (4) Which model better maintains
      long-range coherence for a multi-section paper writing task?

  - name: coding and ML experiment support
    category: Core Task Quality
    description: >
      Labmate helps write ML experiment code, analyze training curves, debug
      PyTorch/JAX pipelines, implement paper methods. Research: (1) HumanEval,
      LiveCodeBench, or SWE-bench scores for both models. (2) Which model is better
      at scientific Python (numpy, pandas, matplotlib, PyTorch) — not just LeetCode
      style? (3) For Labmate's architecture: the spec uses Qwen2.5-Coder-32B as a
      specialist coding worker. Is Qwen3-32B (general) better at coding than
      Gemma 4 31B to the point where it could replace both the orchestrator AND
      the coding specialist? Or does Gemma 4 still need a dedicated coding worker?
      (4) Ability to read and reproduce paper algorithms from pseudocode?

  - name: non-CUDA inference on 32 GB GPU
    category: Deployment
    description: >
      Target personal hardware: 32 GB VRAM non-CUDA GPU. Both models need to run
      via llama.cpp (ROCm/HIP build), MLX (Apple Silicon), or Vulkan. Research:
      (1) Which specific 32 GB non-CUDA GPU models are affordable and confirmed
      working for LLM inference in 2026? Consider: AMD Radeon Pro W7800 (32 GB
      GDDR6), AMD W6800 (32 GB), any RX 9000-series 32 GB variants, Apple M3/M4
      Max (36–48 GB unified), Apple M4 Pro (24–48 GB). Price range and availability.
      (2) llama.cpp ROCm build instructions and known issues for each GPU.
      (3) MLX performance on Apple Silicon for 32B models. (4) Are GGUF quants
      for both Gemma 4 31B and Qwen3-32B readily available and working on ROCm/Metal?
      (5) vLLM ROCm support maturity for these models vs just using llama.cpp.

  - name: VRAM fit and quantization at 32 GB
    category: Deployment
    description: >
      With 32 GB VRAM, both Gemma 4 31B and Qwen3-32B need quantization. Research:
      (1) VRAM usage at Q4_K_M, Q5_K_M, Q6_K for both models — which fits with
      room for 16k+ context KV cache? (2) Quality degradation from Q4 to Q6 for
      academic writing tasks (perplexity, benchmark delta)? (3) Special VRAM
      considerations: Gemma 4's fixed ~3.6 GB SWA KV cache; Qwen3-32B's KV cache
      scaling. (4) Unsloth dynamic quants (UD-Q4_K_XL etc.) — do they help quality
      at same VRAM for both models? (5) With 32 GB can you fit the main LLM +
      BAAI/bge-small-en-v1.5 embedder (0.13 GB) + BAAI/bge-reranker-v2-m3 (2.3 GB)
      co-resident? (6) Is there a Q5 or Q6 sweet spot that fits 32 GB and retains
      near-full academic writing quality?

  - name: agentic tool calling and MCP compatibility
    category: Deployment
    description: >
      Labmate uses an MCP bridge for tool dispatch. The orchestrator must reliably
      call tools, parse structured JSON responses, and chain multi-step tool use.
      Research: (1) Tool-calling reliability for both models: Gemma 4 uses
      --tool-call-parser gemma4 (vLLM) or --jinja (llama.cpp); Qwen3 uses
      --tool-call-parser hermes or similar. Which is more reliable for multi-turn
      tool chains? (2) Structured JSON output (schema-constrained generation)
      quality for both models. (3) Known failure modes: dropped tool args,
      delimiter issues, streaming partial tool calls. (4) Berkeley Function Calling
      Leaderboard (BFCL) scores or equivalent for both models. (5) Which model
      handles the MCP JSON-RPC 2.0 tool-call pattern more naturally?

  - name: thinking mode and reasoning budget control
    category: Deployment
    description: >
      Both models have thinking modes. For Labmate: planning nodes need deep
      reasoning (paper critique, research synthesis); tool-dispatch nodes need
      fast direct responses. Research: (1) Per-request reasoning toggle for both
      models: Gemma 4 uses thinking_budget_tokens (llama.cpp) or reasoning_budget
      (vLLM); Qwen3 uses /think and /no_think tokens in the system prompt, or
      enable_thinking via chat_template_kwargs. Which approach is more reliable
      and flexible? (2) Quality of thinking-on vs thinking-off outputs for academic
      tasks specifically. (3) Thinking token overhead: how many reasoning tokens
      does each model typically generate for a paper critique task? Cost to quality
      ratio. (4) Any per-request budget cap for Qwen3 equivalent to
      thinking_budget_tokens?

  - name: factual accuracy and over-refusal for academic research
    category: Academic Fit
    description: >
      Two failure modes that would hurt Labmate: (A) hallucinating citations,
      statistics, or scientific claims in a paper draft; (B) refusing legitimate
      academic queries on sensitive research topics (biosafety, security research,
      dual-use chemistry, controversial hypotheses). Research: (1) Best available
      factuality benchmarks for both models: SimpleQA, TruthfulQA, GPQA Diamond,
      domain-specific scientific QA. Which hallucinates less on scientific facts?
      (2) Gemma models historically have high refusal rates (62–92% on adversarial
      probes) — is this still true for Gemma 4 31B? How does Qwen3-32B compare?
      (3) XSTest or similar over-refusal benchmarks. (4) Community reports of
      either model refusing legitimate academic research questions. This is a
      first-class concern for a research assistant agent.
